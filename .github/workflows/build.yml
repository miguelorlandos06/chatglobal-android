name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          DATE=$(date +'%Y%m%d-%H%M')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION_NAME}-${DATE}" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             release-artifacts/chatglobal-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.date }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chatglobal-debug-apk
          path: release-artifacts/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ChatGlobal v${{ steps.version.outputs.version_name }} · ${{ steps.version.outputs.date }}
          body: |
            ## ChatGlobal Android · Release automático

            **Versión:** `${{ steps.version.outputs.version_name }}`
            **Commit:** `${{ steps.version.outputs.short_sha }}`
            **Fecha:** `${{ steps.version.outputs.date }}`
          files: release-artifacts/*.apk
          draft: false
          prerelease: false
